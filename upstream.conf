# Origin of the driver sources in src/ (shell syntax, no spaces around "=").
#
# On top of UPSTREAM_TAG, src/ carries the Proxmox VE kernel's r8169 patches
# (revert of Ubuntu's linux-next phylink series) and backported fixes; see
# "git log upstream..main -- src/".
#
# UPSTREAM_URL and UPSTREAM_PATH are used by scripts/import-upstream.sh and
# scripts/backport.sh. UPSTREAM_TAG is embedded into the module (modinfo).
# Update UPSTREAM_TAG/UPSTREAM_COMMIT whenever a new tag is merged into main.
UPSTREAM_URL=https://github.com/MajorP93/ubuntu-kernel-mirror
UPSTREAM_PATH=drivers/net/ethernet/realtek
UPSTREAM_TAG=Ubuntu-7.0.0-41.41
UPSTREAM_COMMIT=7bae00f0ec4a70f9c6501cbb643b4c4fbff18828
