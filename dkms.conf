# DKMS configuration for r8169-dkms.
#
# #MODULE_VERSION# is replaced with the package version at build time:
# by dh_dkms for the Debian package, by "make dkms-install" otherwise.
PACKAGE_NAME="r8169"
PACKAGE_VERSION="#MODULE_VERSION#"

BUILT_MODULE_NAME[0]="r8169"
BUILT_MODULE_LOCATION[0]="."
# Modules in updates/ take precedence over the in-tree kernel/ ones.
DEST_MODULE_LOCATION[0]="/updates/dkms"

MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build R8169_DKMS_VERSION=${PACKAGE_VERSION} modules"

# Only build for Proxmox VE / Proxmox Backup Server 7.0 kernels:
#
# - The driver is the Proxmox kernel's r8169 (Ubuntu's linux-next phylink
#   series reverted) plus fixes. Ubuntu's own 7.0 kernels carry that series
#   and lack include/net/phy/realtek_phy.h and the matching Realtek PHY
#   driver code, so the driver does not fit them.
# - Proxmox restored those in 7.0.14-22-pve; 7.0.14-20/21-pve still have
#   Ubuntu's series. The minimum also excludes the superseded 7.0.14-19-pve
#   and older kernels, which this package is not meant for.
# - Newer kernel series ship a newer r8169 that must not be replaced.
#
# Revisit this when importing a new upstream base.
BUILD_EXCLUSIVE_KERNEL="^7\.0\.[0-9]+-[0-9]+-pve$"
BUILD_EXCLUSIVE_KERNEL_MIN="7.0.14-22"
BUILD_EXCLUSIVE_CONFIG="CONFIG_R8169"

AUTOINSTALL="yes"
